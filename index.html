<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わせがくPURE高等学校 早稲田キャンパス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>わせがくPURE高等学校 早稲田キャンパス</h1>
  <p>デジタルパンフレット</p>

<div id="book">
  <button id="leftArea" onclick="previousPage()" aria-label="前のページへ"></button>

  <img
    id="leftPage"
    src="assets/images/page-01.jpg"
    alt="パンフレット左ページ"
  >

  <img
    id="rightPage"
    src=""
    alt="パンフレット右ページ"
  >

  <button id="rightArea" onclick="nextPage()" aria-label="次のページへ"></button>
</div>

<div class="controls">
  <button id="previousButton" onclick="previousPage()">前へ</button>

  <button id="zoomOutButton" onclick="zoomOut()" aria-label="縮小">−</button>

  <span id="pageNumber">1 / 6</span>

  <button id="zoomInButton" onclick="zoomIn()" aria-label="拡大">＋</button>

  <button id="nextButton" onclick="nextPage()">次へ</button>
</div>
  <div id="zoomModal" class="zoom-modal">
  <button
    id="zoomCloseButton"
    class="zoom-close"
    onclick="closeZoomModal()"
    aria-label="拡大画面を閉じる"
  >
    ×
  </button>

  <div class="zoom-image-wrap">
    <img
      id="zoomImage"
      src=""
      alt="パンフレット拡大画像"
    >
  </div>
</div>
  
  <script src="script.js"></script>

</body>
</html>
